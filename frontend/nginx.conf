map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The container normally sits behind one trusted TLS reverse proxy on the
# host/VPS. Preserve only an exact http/https scheme; malformed or chained
# values fail closed to the scheme seen by this Nginx instance.
map $http_x_forwarded_proto $eduprog_forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://edu.mmcs.sfedu.ru" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $eduprog_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        # A full Moodle course discovery may spend up to 240 seconds reading
        # the settings forms of all supported activities.  Keep the edge
        # timeout above the backend's 300-second browser-client bound so Nginx
        # does not turn a still-running synchronization into a false 504.
        proxy_read_timeout 330s;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $eduprog_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
