[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-moodle-browser"
version = "0.1.0"
description = "Internal bounded Playwright connector for Moodle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.15.0",
  "fastapi==0.139.0",
  "playwright==1.62.0",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

