<div class="qtext"><div class="clearfix">
<p>Написать функцию, вычисляющую для заданного натурального числа N, cумму первых N слагаемых по следующей формуле:</p>
<p><span class="MathJax" id="MathJax-Element-1-Frame" role="textbox" aria-readonly="true"><nobr><span class="math"><span class="mrow"><span class="mo">∑</span><span class="mi">N</span><span class="mi">k</span><span class="mo">=</span><span class="mn">1</span><span class="mo">(</span><span class="mo">−</span><span class="mn">1</span><span class="mo">)</span><span class="mi">k</span><span class="mi">k</span><span class="mo">(</span><span class="mi">k</span><span class="mo">+</span><span class="mn">1</span><span class="mo">)</span></span></span></nobr></span><script id="MathJax-Element-1" type="math/tex">  \sum_{k=1}^{N}{ \frac{(-1)^{k}}{k(k+1)} }  </script><br></p>
<p><span class="MathJax" role="textbox"><nobr><span class="math"><br></span></nobr></span></p>
<p><span class="MathJax" role="textbox"><nobr><span class="math">В основной программе вызвать функцию для разных значений N<br></span></nobr></span></p>
</div></div>
